<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1a1e24" media="(prefers-color-scheme: dark)">
  <title>StudyBlock</title>
  <meta name="description" content="Procedurally generated quizzes that run entirely in your browser.">
  <script>
    // Apply saved theme before first paint to avoid a flash.
    (function () {
      var m = document.cookie.match(/(?:^|;\s*)sb_theme=(light|dark)(?:;|$)/);
      if (m) document.documentElement.setAttribute('data-theme', m[1]);
    })();
  </script>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="#/"><i data-lucide="blocks" class="icon" aria-hidden="true"></i><span class="brand-name">StudyBlock</span></a>
      <span class="page-title" id="page-title" aria-hidden="true"></span>
      <nav class="nav" aria-label="Main">
        <a class="nav-link" data-nav="home" href="#/"><i data-lucide="house" class="icon" aria-hidden="true"></i><span>Home</span></a>
        <a class="nav-link" data-nav="mix" href="#/mix"><i data-lucide="shuffle" class="icon" aria-hidden="true"></i><span>Mix</span></a>
        <a class="nav-link" data-nav="results" href="#/results"><i data-lucide="history" class="icon" aria-hidden="true"></i><span>History</span></a>
        <a class="nav-link" data-nav="settings" href="#/settings"><i data-lucide="settings" class="icon" aria-hidden="true"></i><span>Settings</span></a>
      </nav>
    </div>
  </header>
  <main id="app" class="container" tabindex="-1">
    <!-- Static fallback: replaced by js/app.js on a successful boot. -->
    <div class="card error-box" id="boot-fallback">
      <i data-lucide="triangle-alert" class="icon" aria-hidden="true"></i>
      <div>
        <h2>StudyBlock must be served over HTTP</h2>
        <p>Opening <code>index.html</code> directly from disk (<code>file://</code>) doesn't work: browsers block ES modules and <code>fetch</code> there.</p>
        <p>In the project folder, run:</p>
        <pre class="boot-cmd"><code>py -m http.server 8000 --bind 127.0.0.1</code></pre>
        <p>then open <a href="http://localhost:8000">http://localhost:8000</a>.</p>
      </div>
    </div>
    <script>
      // Served over HTTP: swap the fallback for a loading note until app.js renders.
      // Opened via file:// the module never runs, so the instructions above stay visible.
      (function () {
        if (location.protocol === 'file:') {
          try { if (window.lucide) window.lucide.createIcons(); } catch (e) { /* icons are optional */ }
          return;
        }
        var el = document.getElementById('boot-fallback');
        if (el) el.outerHTML = '<p class="muted">Loading…</p>';
      })();
    </script>
    <noscript>
      <div class="card error-box"><div><h2>JavaScript is required</h2>
        <p>StudyBlock runs entirely in your browser. Enable JavaScript and serve the folder over HTTP
        (<code>py -m http.server 8000 --bind 127.0.0.1</code>, then open http://localhost:8000).</p></div></div>
    </noscript>
  </main>
</body>
</html>
