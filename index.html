<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>StudyBlock</title>
  <meta name="description" content="Procedurally generated quizzes that run entirely in your browser.">
  <script>
    // Apply saved theme before first paint to avoid a flash.
    (function () {
      var m = document.cookie.match(/(?:^|;\s*)sb_theme=(light|dark)(?:;|$)/);
      if (m) document.documentElement.setAttribute('data-theme', m[1]);
    })();
  </script>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="#/"><i data-lucide="blocks" class="icon" aria-hidden="true"></i><span>StudyBlock</span></a>
      <nav class="nav" aria-label="Main">
        <a class="nav-link" data-nav="home" href="#/"><i data-lucide="house" class="icon" aria-hidden="true"></i><span>Modules</span></a>
        <a class="nav-link" data-nav="results" href="#/results"><i data-lucide="history" class="icon" aria-hidden="true"></i><span>History</span></a>
        <a class="nav-link" data-nav="settings" href="#/settings"><i data-lucide="settings" class="icon" aria-hidden="true"></i><span>Settings</span></a>
      </nav>
    </div>
  </header>
  <main id="app" class="container" tabindex="-1">
    <noscript><p>StudyBlock needs JavaScript and must be served over HTTP (see README).</p></noscript>
  </main>
</body>
</html>
